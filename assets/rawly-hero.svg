<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Rawly — local media processing for Codex and Claude Code</title>
<desc id="desc">A dark grid with a blue Rawly wordmark. Four steps: files, image processing, metadata, output.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#0b1520"/></linearGradient>
  <linearGradient id="blue"><stop stop-color="#0866ff"/><stop offset="1" stop-color="#43d6ee"/></linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#283545" stroke-width="1" opacity=".5"/></pattern>
</defs>
<rect width="1200" height="420" rx="24" fill="url(#bg)"/>
<rect width="1200" height="420" rx="24" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#303c4b" stroke-width="2"/>
<circle cx="1110" cy="25" r="200" fill="#1264ff" opacity=".065"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="64" y="54" fill="#8d9bad" font-size="13" font-weight="700" letter-spacing="2.2">OPEN SOURCE · LOCAL MEDIA TOOLKIT</text>
  <text x="60" y="137" fill="#f0f6fc" font-size="88" font-weight="800" letter-spacing="-5">rawly<tspan fill="#267eff">.</tspan></text>
  <rect x="64" y="156" width="484" height="4" rx="2" fill="url(#blue)"/>
  <text x="64" y="194" fill="#b3becc" font-size="19">Clean metadata. Process images. Keep control.</text>
  <rect x="942" y="83" width="194" height="40" rx="20" fill="#102740" stroke="#284668"/>
  <circle cx="964" cy="103" r="4" fill="#64d6bb"/>
  <text x="980" y="109" fill="#bdcde0" font-size="13" font-weight="600">FILES STAY LOCAL</text>
  <g transform="translate(64 233)">
    <rect width="226" height="88" rx="13" fill="#141d29" stroke="#354253"/>
    <rect width="4" height="88" rx="2" fill="#778bff"/>
    <text x="22" y="33" fill="#f0f6fc" font-size="15" font-weight="700">01 · YOUR FILES</text>
    <text x="22" y="60" fill="#93a1b4" font-size="13">One photo or an entire folder</text>
    <path d="M236 44h30m-7-6 7 6-7 6" stroke="#586a80" fill="none" stroke-width="2"/>
    <g transform="translate(278)">
      <rect width="226" height="88" rx="13" fill="#141d29" stroke="#354253"/>
      <rect width="4" height="88" rx="2" fill="#2279ff"/>
      <text x="22" y="33" fill="#f0f6fc" font-size="15" font-weight="700">02 · PROCESS</text>
      <text x="22" y="60" fill="#93a1b4" font-size="13">Full-frame D image pipeline</text>
    </g>
    <path d="M514 44h30m-7-6 7 6-7 6" stroke="#586a80" fill="none" stroke-width="2"/>
    <g transform="translate(556)">
      <rect width="226" height="88" rx="13" fill="#141d29" stroke="#354253"/>
      <rect width="4" height="88" rx="2" fill="#2dbfd4"/>
      <text x="22" y="33" fill="#f0f6fc" font-size="15" font-weight="700">03 · METADATA</text>
      <text x="22" y="60" fill="#93a1b4" font-size="13">Clean tags · optional profile</text>
    </g>
    <path d="M792 44h30m-7-6 7 6-7 6" stroke="#586a80" fill="none" stroke-width="2"/>
    <g transform="translate(834)">
      <rect width="238" height="88" rx="13" fill="#141d29" stroke="#354253"/>
      <rect width="4" height="88" rx="2" fill="#67ceb7"/>
      <text x="22" y="33" fill="#f0f6fc" font-size="15" font-weight="700">04 · READY TO USE</text>
      <text x="22" y="60" fill="#93a1b4" font-size="13">New files + a batch report</text>
    </g>
  </g>
  <text x="64" y="380" fill="#738298" font-size="12" font-weight="700" letter-spacing="1.2">CODEX · CLAUDE CODE · PYTHON CLI</text>
  <text x="1136" y="380" fill="#738298" font-size="12" font-weight="700" text-anchor="end">NO API KEYS · NO GPU · MIT</text>
</g>
</svg>
