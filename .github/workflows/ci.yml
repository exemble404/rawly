name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: skills/rawly/requirements.txt
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libimage-exiftool-perl
      - name: macOS system dependencies
        if: runner.os == 'macOS'
        run: brew install ffmpeg exiftool
      - name: Python dependencies
        run: python -m pip install -r skills/rawly/requirements.txt
      - name: Runtime diagnostics
        run: python skills/rawly/scripts/rawly.py doctor
      - name: Tests
        run: python -m unittest discover -s tests -v
