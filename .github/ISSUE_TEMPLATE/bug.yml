name: Bug report
description: A reproducible problem with processing or skill installation.
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and what actually happened.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps or command
      description: Remove personal paths, credentials and private metadata.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, host agent and rawly doctor output.
  - type: textarea
    id: sample
    attributes:
      label: Minimal sample
      description: Prefer generated media. Only attach files you can share publicly.
